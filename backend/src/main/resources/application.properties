spring.application.name=sixt

# Sin el banner de Spring tapando el menu
spring.main.banner-mode=off

# Solo warnings y errores, asi los logs no se mezclan con la consola
logging.level.root=WARN

# Puerto web para la plataforma
server.port=${SERVER_PORT:8000}

# Configuracion de MySQL.
# Por defecto usa localhost para correr fuera de Docker.
# En Docker Compose, la variable DB_HOST queda en "mysql".
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/sixt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:sixt}
spring.datasource.password=${DB_PASSWORD:sixt123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT de la app seguridad. La clave firma los tokens (HS256): minimo 32 caracteres.
# Este valor es solo para desarrollo; en Docker se pisa con la variable SIXT_JWT_SECRETO.
sixt.jwt.secreto=${SIXT_JWT_SECRETO:clave-de-desarrollo-sixt-cambiar-en-produccion}
sixt.jwt.duracion=8h
