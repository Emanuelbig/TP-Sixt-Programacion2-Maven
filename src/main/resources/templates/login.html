<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sixt | Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #1d222a;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            background: #2b313b;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 28px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 2rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        label {
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #4a5362;
            background: #1f252d;
            color: white;
            box-sizing: border-box;
        }

        button {
            background: #69a7ff;
            color: #08111c;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff8c8c;
            margin-top: 8px;
            text-align: center;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Sixt</h1>

        <form method="post" action="/login">
            <div>
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" placeholder="admin" required>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" placeholder="1234" required>
            </div>

            <button type="submit">Ingresar</button>
        </form>

        <div class="error" th:if="${error != null}">
            <span th:text="${error}"></span>
        </div>
    </div>
</body>
</html>
