<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sixt | Inicio</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: #1f2937;
            padding: 40px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.25);
        }
        h1 { margin-bottom: 10px; }
        p { color: #cbd5e1; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Bienvenido</h1>
        <p>Usuario logueado: <strong th:text="${username}"></strong></p>
        <p>Esta es la pantalla principal de Sixt.</p>
    </div>
</body>
</html>
