services:
  mysql:
    image: mysql:8.4
    container_name: sixt-mysql
    environment:
      MYSQL_DATABASE: sixt
      MYSQL_USER: sixt
      MYSQL_PASSWORD: sixt123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5.2.2-apache
    container_name: sixt-phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "8080:80"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sixt-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8000
      DB_HOST: mysql
      DB_USERNAME: sixt
      DB_PASSWORD: sixt123
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sixt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: sixt
      SPRING_DATASOURCE_PASSWORD: sixt123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  mysql_data:
